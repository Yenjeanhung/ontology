# ══════════════════════════════════════════════════════════════
# 配置注入：ConfigMap（非敏感） + Secret（敏感，模板需替换占位符）
# pydantic BaseSettings 按大写同名规则自动读取环境变量（见 backend/config.py）
# ══════════════════════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: knowsource-config
  namespace: knowsource
data:
  # ── 存储/中间件拓扑（集群内 service 名按实际替换） ──
  VECTOR_STORE_PROVIDER: "milvus"
  MILVUS_HOST: "milvus.knowsource.svc.cluster.local"
  MILVUS_PORT: "19530"
  GRAPH_STORE_PROVIDER: "neo4j"
  NEO4J_URI: "bolt://neo4j.knowsource.svc.cluster.local:7687"
  NEO4J_USER: "neo4j"
  NEO4J_DATABASE: "neo4j"
  # ── 服务 ──
  HOST: "0.0.0.0"
  PORT: "8000"
  CORS_ALLOW_ORIGINS: "https://knowsource.example.com"
  # ── 可观测：LangSmith（评估/追踪） ──
  LANGSMITH_TRACING: "true"
  LANGSMITH_PROJECT: "ontology-multi-agent"
  # ── Function Calling 工具链 / MCP ──
  TOOL_LOOP_MAX_ITERATIONS: "4"
  # 平台同时作为 MCP 客户端接入外部工具（JSON 数组；空=不接入）：
  MCP_SERVERS: ""
  # PLATFORM 作为 MCP 服务器对暴露出的基础镜像内部演示：
  # kubectl exec -it deploy/knowsource -- python scripts/mcp_server.py
---
# ⚠️ 模板文件：apply 前替换所有 <CHANGE_ME> 占位符；生产建议接 sealed-secrets / external-secrets
apiVersion: v1
kind: Secret
metadata:
  name: knowsource-secret
  namespace: knowsource
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://knowsource:<CHANGE_ME_DB_PASS>@postgres.knowsource.svc.cluster.local:5432/knowsource"
  NEO4J_PASSWORD: "<CHANGE_ME_NEO4J_PASS>"
  LANGSMITH_API_KEY: "<CHANGE_ME_LSMITH_KEY>"

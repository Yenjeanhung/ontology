# KnowSource 前端容器配置：托管 Vite dist + 反代后端（单机 compose 形态）
# 挂载点：/etc/nginx/conf.d/default.conf（见 docker-compose.prod.yml 的 frontend 卷）
# 改完配置：docker compose -f docker-compose.prod.yml restart frontend 即生效
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite 指纹文件名，可长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API 反代到后端容器（compose 服务名 DNS）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 必备：多智能体/工作流流式输出（关缓冲 + 长超时）
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_cache off;
    }
    location /docs        { proxy_pass http://backend:8000; }
    location /openapi.json { proxy_pass http://backend:8000; }

    # history 路由回退（vue-router createWebHistory 必需）
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 知识图谱平台的数据库环境
#
# 组件：
#   - PostgreSQL 16（关系数据库，主数据存储，替代 SQLite）
#   - Neo4j 5.26（图数据库，预装 Graph Data Science 插件，供后续图计算使用）
#   - Milvus 2.5 standalone（向量数据库，依赖 etcd + MinIO 做元信息与对象存储）
#
# 启动：docker compose up -d
# 停止：docker compose down
# 清库：docker compose down -v   （会删除所有数据卷，慎用）
#
# 注意：首次启动 Milvus 约需 30~60 秒完成初始化，Neo4j 约需 30 秒。
# 建议机器内存 >= 16GB（Milvus standalone 默认占用约 4~6GB）。

services:
  # ──────────────────────── 关系数据库：PostgreSQL ────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ontology-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"   # 应用连接，对应 .env 的 DATABASE_URL=postgresql+asyncpg://ontology:ontology123@localhost:5432/knowsource
    environment:
      # 必须与 backend/.env 中 DATABASE_URL 的用户/密码/库名保持一致
      POSTGRES_USER: ontology
      POSTGRES_PASSWORD: ontology123
      POSTGRES_DB: knowsource
      # 时区与排序规则（中文友好）
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontology -d knowsource"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ───────────────────────────── 图数据库：Neo4j ─────────────────────────────
  neo4j:
    image: neo4j:5.26.0
    container_name: ontology-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP（浏览器管理界面 http://localhost:7474）
      - "7687:7687"   # Bolt（应用连接，对应 .env 的 NEO4J_URI=bolt://localhost:7687）
    environment:
      # 初始密码，至少 8 位。必须与 backend/.env 中的 NEO4J_PASSWORD 一致。
      NEO4J_AUTH: neo4j/ontology123
      # 允许在浏览器中执行任意 Cypher（方便调试，生产可去掉）
      NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*,algo.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*,apoc.*,algo.*"
      # 自动下载插件：GDS（图计算）+ APOC（图算法工具库）
      NEO4J_PLUGINS: '["graph-data-science", "apoc"]'
      # JVM 内存。内存紧张时调小；图规模大时调大。
      NEO4J_server_memory_heap_initial__size: 2G
      NEO4J_server_memory_heap_max__size: 4G
      NEO4J_server_memory_pagecache_size: 2G
      # 开启 CSV 导入时允许读取容器外文件（数据导入脚本用得到）
      NEO4J_dbms_security_allow__csv__import__from__file__urls: "true"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      # 用 cypher-shell 探测；Neo4j 官方镜像自带 cypher-shell
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ontology123 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ───────────────────────── Milvus 依赖：etcd（元信息存储）─────────────────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: ontology-milvus-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: >-
      etcd -advertise-client-urls=http://etcd:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ───────────────────────── Milvus 依赖：MinIO（对象存储）─────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: ontology-milvus-minio
    restart: unless-stopped
    environment:
      # MINIO_ACCESS_KEY / MINIO_SECRET_KEY 已废弃，必须用新的 ROOT_USER / ROOT_PASSWORD
      # 注意：改动这里的值，必须同步改下面 milvus 的 MINIO_ACCESS_KEY_ID / MINIO_SECRET_ACCESS_KEY
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9001:9001"   # MinIO 管理界面 http://localhost:9001
      - "9000:9000"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ─────────────────────────── 向量数据库：Milvus ───────────────────────────
  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: ontology-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      # 显式声明 MinIO 凭据，不再依赖 Milvus 内置的隐式默认值
      # 必须与上面 minio 服务的 MINIO_ROOT_USER / MINIO_ROOT_PASSWORD 保持一致
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
      # 日志级别（调试时改成 debug）
      MILVUS_LOG_LEVEL: info
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"   # gRPC（应用连接，对应 .env 的 MILVUS_PORT=19530）
      - "9091:9091"     # HTTP 健康检查
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  # ───────────────────── Milvus 可视化管理（可选，推荐）─────────────────────
  attu:
    image: zilliz/attu:v2.5.4
    container_name: ontology-attu
    restart: unless-stopped
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "8001:3000"     # Attu 界面 http://localhost:8001
    depends_on:
      - milvus

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  etcd_data:
  minio_data:
  milvus_data:

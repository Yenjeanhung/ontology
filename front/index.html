<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KnowSource</title>
  <script>
    // 首屏即设定主题，默认数据平台深色，避免加载时的浅色闪烁
    (function () {
      try {
        var t = localStorage.getItem('knowsource.theme');
        // 旧版曾未经用户操作就把默认金色(dark)写入 localStorage；
        // 升级后首次打开时一次性重置为新默认青蓝（写入 v2 标记后不再干预用户选择）
        if (t === 'dark' && !localStorage.getItem('knowsource.theme.v2')) {
          localStorage.setItem('knowsource.theme.v2', '1');
          t = null;
        }
        if (t !== 'light' && t !== 'dark' && t !== 'platform-dark') t = 'platform-dark';
      } catch (e) { t = 'platform-dark'; }
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
